[platformio]
default_envs = diagnostico

[env:diagnostico]
build_src_filter = -<*> +<main.cpp>
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 57600
build_flags = -I.
lib_deps = bblanchon/ArduinoJson@6.21.5

[env:prueba_a0]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 57600
build_src_filter = -<*> +<prueba_a0.cpp>

[env:supabase_sensor]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
board_build.f_cpu = 160000000L
monitor_speed = 115200
upload_speed = 57600
build_flags = -I.
lib_deps = bblanchon/ArduinoJson@6.21.5
build_src_filter = -<*> +<supabase_sensor.cpp>

[env:bomba_local]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 57600
build_src_filter = -<*> +<pump_offline.cpp>
build_flags = -DHIDROSMART_PUMP_VERIFIED=1

[env:control_cloud]
extends = env:supabase_sensor
build_src_filter = -<*> +<cloud_controller.cpp>
